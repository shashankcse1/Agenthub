name: SDK publish (secrets-gated)

# Human-gated real publish. Dry-run CI remains sdk-publish-dry-run.yml.
# Requires repository secrets: NPM_TOKEN, TWINE_USERNAME, TWINE_PASSWORD (or Twine token as password).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to confirm a live registry publish'
        required: true
        default: ''

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirm
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Refusing publish: set confirm=publish"
            exit 1
          fi
      - name: Require registry secrets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          missing=0
          [ -z "$NPM_TOKEN" ] && echo "Missing secret NPM_TOKEN" && missing=1
          [ -z "$TWINE_USERNAME" ] && echo "Missing secret TWINE_USERNAME" && missing=1
          [ -z "$TWINE_PASSWORD" ] && echo "Missing secret TWINE_PASSWORD" && missing=1
          if [ "$missing" -ne 0 ]; then
            echo "Secrets not configured — workflow ready; live publish blocked until tokens exist."
            exit 1
          fi

  js-sdk:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run check
          npm publish --access public

  python-sdk:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and upload
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          twine upload dist/*
