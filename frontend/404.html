<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0e14" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <title>404 | AgentHub</title>
    <link rel="stylesheet" href="./fonts.css?v=20260804-ui17" />
    <style>
      :root {
        --bg: #0c1018;
        --card: rgba(14, 20, 30, 0.92);
        --ink: #f3f0e8;
        --soft: #9aa3b2;
        --line: rgba(196, 163, 90, 0.28);
        --accent: #c4a35a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(ellipse 60% 50% at 15% 10%, rgba(196, 163, 90, 0.18), transparent 55%),
          linear-gradient(160deg, #070a10, #121925 55%, #0a0e14);
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        width: min(680px, 100%);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        padding: 28px;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .kicker {
        margin: 0 0 0.55rem;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 10px;
        font-size: var(--type-page);
        font-weight: var(--font-weight-bold);
      }
      p {
        margin: 0 0 12px;
        color: var(--soft);
        line-height: var(--leading-relaxed);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      a {
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.65rem 0.95rem;
        min-height: var(--control-height);
        display: inline-flex;
        align-items: center;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.04);
        font-family: var(--font-body);
        font-size: var(--type-label);
        font-weight: var(--font-weight-semibold);
      }
      a.primary { background: var(--accent); color: #141a24; border-color: transparent; }
      .mono { color: var(--soft); }
    </style>
  </head>
  <body>
    <article class="card" role="main" aria-labelledby="title404">
      <p class="kicker">Governance Plane</p>
      <p class="mono">HTTP 404</p>
      <h1 id="title404">Page not found</h1>
      <p>The page you requested is unavailable or has moved. If you received this link from an email or bookmark, verify the URL and try again.</p>
      <p class="mono">Reference: NAV-404</p>
      <div class="actions">
        <a class="primary" href="./">Return to Dashboard</a>
        <a href="./login.html">Sign in</a>
        <a href="./500.html">Incident Guidance</a>
      </div>
    </article>
  </body>
</html>
