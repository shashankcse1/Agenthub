<section id="audit" class="view">
          <article class="card">
            <div class="card-head">
              <h3>Recent Audit Events</h3>
              <button id="loadAudit" class="ghost">Load</button>
            </div>
            <div class="table-wrap">
              <table>
                <caption class="sr-only">Recent audit events by time, actor, action, and outcome</caption>
                <thead>
                  <tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Outcome</th></tr>
                </thead>
                <tbody id="auditTable"></tbody>
              </table>
            </div>
          </article>
        </section>
