<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentHub Login</title>
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="brand-row">
          <img src="./logo.svg" alt="AgentHub logo" class="brand-logo" />
          <div>
            <p class="eyebrow">AgentHub Control Center</p>
            <h1 id="loginTitle">Operator Login</h1>
          </div>
        </div>

        <p class="subtitle">Sign in to continue to the production-grade operations console.</p>

        <form id="loginForm" class="login-form">
          <label>
            Environment
            <select id="environmentProfile" required>
              <option value="local">Local</option>
              <option value="stage">Stage</option>
              <option value="prod">Prod</option>
            </select>
          </label>

          <label>
            API Base URL
            <input id="apiBase" type="url" required value="http://127.0.0.1:8000" />
          </label>

          <label>
            Username
            <input id="username" type="text" required placeholder="prod-operator" />
          </label>

          <label>
            Password
            <input id="password" type="password" required placeholder="Enter password" />
          </label>

          <label>
            MFA Verified
            <select id="mfaVerified">
              <option value="true" selected>true</option>
              <option value="false">false</option>
            </select>
          </label>

          <button type="submit" class="primary">Sign In</button>
        </form>

        <p id="loginStatus" class="status" aria-live="polite">Enter credentials to sign in.</p>
      </section>
    </main>

    <script src="./login.js"></script>
  </body>
</html>
